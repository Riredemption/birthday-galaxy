<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>致 亲爱的 · 生日快乐</title>
<style>
  :root{
    --ink:#070a18;
    --ink-2:#0b1026;
    --gold:#e8c9a0;
    --rose:#e8b4a0;
    --warm:#ffd9a0;
    --text:#f2e9df;
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",serif;
    --hand:"Kaiti SC","STKaiti","KaiTi","Kaiti",cursive;
    --ease:cubic-bezier(.22,1,.36,1);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{height:100%;}

  body{
    margin:0;
    background:
      radial-gradient(120% 90% at 50% -10%, #1a2145 0%, #0b1026 42%, #060814 100%);
    color:var(--text);
    font-family:var(--serif);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  button{font-family:inherit;}

  .eyebrow{
    margin:0;
    font-size:11px;
    letter-spacing:.46em;
    text-transform:uppercase;
    color:rgba(232,201,160,.72);
    font-family:var(--serif);
    text-indent:.46em;
  }

  /* ---------- 背景画布 ---------- */
  #stars,#fx{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }
  #stars{z-index:0;}
  #fx{z-index:3;}

  #cursorGlow{
    position:fixed;
    left:0;top:0;
    width:520px;height:520px;
    margin:-260px 0 0 -260px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(232,180,160,.13),rgba(232,180,160,0) 70%);
    pointer-events:none;
    z-index:0;
    opacity:0;
    transition:opacity .6s ease;
    will-change:transform;
  }

  #dim{
    position:fixed;
    inset:0;
    background:#02030a;
    opacity:0;
    pointer-events:none;
    z-index:2;
    transition:opacity 1.1s ease;
  }
  #dim.show{opacity:.62;}
  #dim.soft{opacity:.3;}

  /* ---------- 场景 ---------- */
  .scene{
    position:fixed;
    inset:0;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(14px,2.4vh,26px);
    padding:
      max(26px,env(safe-area-inset-top))
      clamp(18px,5vw,56px)
      max(26px,env(safe-area-inset-bottom));
    opacity:0;
    visibility:hidden;
    transform:scale(1.025);
    transition:opacity .95s var(--ease),transform .95s var(--ease),visibility 0s linear .95s;
    overflow:hidden;
  }
  .scene.active{
    opacity:1;
    visibility:visible;
    transform:none;
    transition:opacity .95s var(--ease),transform .95s var(--ease),visibility 0s;
  }
  .scene.active.fadeaway{
    opacity:0;
    visibility:hidden;
    transition:opacity 1.4s ease,visibility 0s linear 1.4s;
  }

  .scene-head{text-align:center;display:flex;flex-direction:column;gap:10px;}
  .scene-head h2{
    margin:0;
    font-size:clamp(25px,4.6vw,36px);
    font-weight:500;
    letter-spacing:.26em;
    text-indent:.26em;
    color:#fbf1e4;
    text-shadow:0 0 34px rgba(232,180,160,.28);
  }
  .scene-head h2.title-en{
    font-size:clamp(15px,2.5vw,21px);
    letter-spacing:.18em;
    text-indent:.18em;
    line-height:1.7;
    max-width:820px;
  }
  .scene-sub{
    margin:0;
    font-size:12.5px;
    letter-spacing:.16em;
    color:rgba(242,233,223,.54);
    font-family:var(--hand);
  }

  .scene-foot{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }

  /* ---------- 按钮 ---------- */
  .btn{
    appearance:none;
    border:1px solid rgba(232,201,160,.42);
    background:linear-gradient(180deg,rgba(232,201,160,.12),rgba(232,201,160,.02));
    color:#f6e9d8;
    font-size:12.5px;
    letter-spacing:.26em;
    text-indent:.26em;
    padding:13px 28px;
    border-radius:999px;
    cursor:pointer;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    transition:background .45s ease,border-color .45s ease,box-shadow .45s ease,transform .45s ease,opacity .45s ease;
  }
  .btn:hover{
    background:rgba(232,201,160,.18);
    border-color:rgba(232,201,160,.82);
    box-shadow:0 0 30px rgba(232,180,160,.24);
    transform:translateY(-2px);
  }
  .btn:active{transform:translateY(0) scale(.985);}
  .btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none;}
  .btn.tiny{font-size:11.5px;padding:10px 20px;letter-spacing:.2em;}

  /* ---------- 第一幕：封面 ---------- */
  .cover{overflow:hidden;}
  .aurora{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:.4;
    pointer-events:none;
  }
  .aurora.a1{
    width:min(70vw,640px);height:min(70vw,640px);
    top:-14%;left:-18%;
    background:radial-gradient(circle,#3a2f72 0%,rgba(58,47,114,0) 70%);
    animation:drift 20s ease-in-out infinite alternate;
  }
  .aurora.a2{
    width:min(60vw,520px);height:min(60vw,520px);
    bottom:-18%;right:-14%;
    background:radial-gradient(circle,#6b3a4e 0%,rgba(107,58,78,0) 70%);
    opacity:.32;
    animation:drift 26s ease-in-out -9s infinite alternate-reverse;
  }

  .cover-inner{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    transition:opacity 1s ease,transform 1s var(--ease);
  }
  .cover-inner.gone{
    opacity:0;
    transform:translateY(-18px);
    pointer-events:none;
  }

  .cover-title{
    margin:18px 0 0;
    font-size:clamp(30px,6.4vw,48px);
    font-weight:500;
    letter-spacing:.16em;
    text-indent:.16em;
    color:#fbf2e6;
    text-shadow:0 0 40px rgba(232,180,160,.35);
  }
  .cover-sub{
    margin:14px 0 0;
    font-family:var(--hand);
    font-size:14px;
    letter-spacing:.18em;
    color:rgba(242,233,223,.6);
  }

  .envelope{
    position:relative;
    width:224px;
    height:148px;
    margin:44px 0 0;
    border:0;
    background:none;
    cursor:pointer;
    perspective:900px;
    filter:drop-shadow(0 24px 44px rgba(232,201,160,.16));
    animation:floaty 5.5s ease-in-out infinite;
    transition:opacity .8s ease,transform .8s var(--ease);
  }
  .envelope.opened{
    opacity:0;
    transform:translateY(-34px) scale(.94);
    pointer-events:none;
    animation:none;
  }
  .env-glow{
    position:absolute;
    inset:-40px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,217,160,.28),rgba(255,217,160,0) 68%);
    animation:breathe 4.5s ease-in-out infinite;
  }
  .env-body{
    position:absolute;
    inset:0;
    border-radius:9px;
    background:linear-gradient(158deg,#f8ecd9 0%,#e3c8a6 52%,#c9a37e 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),inset 0 -18px 30px rgba(150,110,70,.18);
  }
  .env-body::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:9px;
    background:
      linear-gradient(133deg,transparent 49.4%,rgba(150,110,70,.28) 49.8%,transparent 50.4%),
      linear-gradient(-133deg,transparent 49.4%,rgba(150,110,70,.28) 49.8%,transparent 50.4%);
  }
  .env-flap{
    position:absolute;
    left:0;top:0;
    width:100%;height:80px;
    background:linear-gradient(180deg,#fbf2e2,#e6cbaa);
    clip-path:polygon(0 0,100% 0,50% 100%);
    border-radius:9px 9px 0 0;
    transform-origin:top center;
    transition:transform 1s var(--ease);
  }
  .envelope.open .env-flap{transform:rotateX(-172deg);}
  .env-seal{
    position:absolute;
    left:50%;top:66px;
    width:42px;height:42px;
    margin:-21px 0 0 -21px;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:15px;
    color:#ffe9d9;
    background:radial-gradient(circle at 34% 28%,#e8a08c,#b04a44 62%,#8e3634 100%);
    box-shadow:0 5px 16px rgba(120,40,40,.5),inset 0 1px 1px rgba(255,255,255,.4);
    transition:opacity .5s ease,transform .5s ease;
  }
  .envelope.open .env-seal{opacity:0;transform:scale(.5);}

  .hint{
    margin:26px 0 0;
    font-size:11px;
    letter-spacing:.32em;
    text-indent:.32em;
    color:rgba(232,201,160,.55);
    animation:hintPulse 3s ease-in-out infinite;
  }

  /* ---------- 拆信后的名字说明 ---------- */
  .name-copy{
    position:fixed;
    left:50%;
    bottom:16%;
    transform:translate(-50%,18px);
    z-index:4;
    width:min(88vw,560px);
    text-align:center;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity 1.1s ease,transform 1.1s var(--ease),visibility 0s linear 1.1s;
  }
  .name-copy.show{
    opacity:1;
    visibility:visible;
    transform:translate(-50%,0);
    pointer-events:auto;
    transition:opacity 1.1s ease,transform 1.1s var(--ease),visibility 0s;
  }
  .name-quote{
    margin:16px 0 26px;
    font-family:var(--hand);
    font-size:clamp(15px,3.4vw,18px);
    letter-spacing:.2em;
    color:rgba(246,233,216,.82);
  }

  /* ---------- 第二幕：一些照片 ---------- */
  .gallery{
    justify-content:center;
    gap:clamp(10px,2vh,20px);
    padding-left:0;
    padding-right:0;
  }
  .gallery .scene-head,
  .gallery .scene-foot{
    padding-left:20px;
    padding-right:20px;
  }
  .track{
    --card-w:286px;
    position:relative;
    display:flex;
    align-items:center;
    gap:26px;
    width:100%;
    padding:22px calc((100vw - var(--card-w)) / 2) 30px;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
    touch-action:pan-x;
  }
  .track::-webkit-scrollbar{display:none;}

  .card{
    flex:0 0 var(--card-w);
    scroll-snap-align:center;
    transform:rotate(-1.8deg);
    transition:transform .6s var(--ease);
  }
  .card:nth-child(even){transform:rotate(1.4deg);}
  .card:hover{transform:rotate(0deg) translateY(-4px);}

  .print{
    position:relative;
    display:flex;
    flex-direction:column;
    padding:13px 13px 10px;
    border-radius:4px;
    background:linear-gradient(160deg,#f9f2e6,#e8dac4);
    box-shadow:0 26px 54px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.55);
  }
  .print::before{
    content:"";
    position:absolute;
    left:50%;top:-11px;
    width:78px;height:22px;
    transform:translateX(-50%) rotate(-2.4deg);
    background:linear-gradient(90deg,rgba(232,201,160,.52),rgba(232,201,160,.2));
    border-radius:2px;
    box-shadow:0 2px 5px rgba(0,0,0,.12);
  }
  .photo{
    position:relative;
    aspect-ratio:4 / 5;
    border-radius:2px;
    overflow:hidden;
    background:linear-gradient(150deg,#1c2344 0%,#2b3152 55%,#3b3350 100%);
  }
  .photo img{
    display:block;
    width:100%;height:100%;
    object-fit:cover;
  }
  .ph-fallback{
    position:absolute;
    inset:10px;
    border:1px dashed rgba(232,201,160,.28);
    border-radius:2px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:9px;
    color:rgba(232,201,160,.72);
    font-size:12px;
    letter-spacing:.16em;
    text-align:center;
  }
  .ph-fallback span{font-size:13px;}
  .ph-fallback small{
    font-size:9.5px;
    letter-spacing:.06em;
    opacity:.55;
    font-family:var(--serif);
  }
  .caption{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:3.4em;
    margin:10px 4px 0;
    font-family:var(--hand);
    font-size:14.5px;
    line-height:1.55;
    letter-spacing:.05em;
    color:#3b322d;
    text-align:center;
  }

  .dots{
    display:flex;
    align-items:center;
    gap:2px;
    height:16px;
  }
  .dot{
    position:relative;
    width:16px;height:16px;
    border:0;
    padding:0;
    background:none;
    cursor:pointer;
  }
  .dot::after{
    content:"";
    position:absolute;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:5px;height:5px;
    border-radius:999px;
    background:rgba(232,201,160,.32);
    transition:width .5s var(--ease),background .5s ease;
  }
  .dot.active::after{
    width:16px;
    background:rgba(232,201,160,.85);
  }

  /* ---------- 第三幕：想对你说 ---------- */
  .bloom{
    gap:clamp(8px,1.6vh,18px);
  }
  .bloom::before{
    content:"";
    position:absolute;
    width:min(120vw,760px);height:min(120vw,760px);
    left:50%;top:44%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,rgba(120,60,80,.34) 0%,rgba(80,45,90,.16) 38%,rgba(80,45,90,0) 70%);
    pointer-events:none;
  }

  .halo-frame{
    position:relative;
    width:300px;height:300px;
    display:grid;
    place-items:center;
    margin:6px 0 2px;
    flex:0 0 auto;
  }
  .halo{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:conic-gradient(from 0deg,
      rgba(232,180,160,0) 0deg,
      rgba(232,180,160,.75) 90deg,
      rgba(255,217,160,.18) 180deg,
      rgba(232,180,160,.6) 280deg,
      rgba(232,180,160,0) 360deg);
    filter:blur(16px);
    animation:spin 16s linear infinite;
  }
  .ring{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(232,201,160,.18);
    pointer-events:none;
  }
  .ring.r1{inset:25px;animation:ringPulse 6s ease-in-out infinite;}
  .ring.r2{inset:6px;border-color:rgba(232,201,160,.1);animation:ringPulse 6s ease-in-out -3s infinite;}

  .portrait{
    position:relative;
    width:236px;height:236px;
    border-radius:50%;
    overflow:hidden;
    background:linear-gradient(160deg,#242c4e,#11152a);
    box-shadow:
      0 0 70px rgba(232,180,160,.28),
      inset 0 0 0 1px rgba(255,255,255,.16);
  }
  .portrait img{
    display:block;
    width:100%;height:100%;
    object-fit:cover;
  }
  .portrait .ph-fallback{border-radius:50%;inset:12px;}

  .lines{
    display:flex;
    flex-direction:column;
    gap:6px;
    text-align:center;
    max-width:560px;
    padding:0 12px;
  }
  .line{
    margin:0;
    font-size:clamp(14.5px,3.3vw,17px);
    line-height:1.9;
    letter-spacing:.12em;
    color:rgba(243,230,216,.88);
    opacity:0;
    transform:translateY(14px);
    transition:opacity 1.4s ease,transform 1.4s var(--ease);
  }
  .line.in{opacity:1;transform:none;}

  /* ---------- 第四幕：许愿 ---------- */
  .candle{justify-content:center;}
  .candle::before{
    content:"";
    position:absolute;
    width:min(90vw,520px);height:min(90vw,520px);
    left:50%;top:56%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,180,110,.14) 0%,rgba(255,140,90,.06) 40%,rgba(255,140,90,0) 70%);
    pointer-events:none;
    transition:opacity 1.2s ease;
  }
  .candle.blown::before{opacity:0;}

  .cake-wrap{
    position:relative;
    margin:4px 0 0;
    transform:translateY(16px) scale(.97);
    opacity:0;
    transition:opacity 1.3s ease .2s,transform 1.3s var(--ease) .2s;
  }
  .scene.active .cake-wrap{opacity:1;transform:none;}

  .cake{
    position:relative;
    width:260px;height:214px;
    filter:drop-shadow(0 30px 40px rgba(0,0,0,.45));
  }
  .cake-plate{
    position:absolute;
    left:0;bottom:4px;
    width:260px;height:18px;
    border-radius:50%;
    background:radial-gradient(ellipse at 50% 30%,#f3dcc0 0%,#a58265 45%,rgba(90,66,52,.2) 72%,transparent 74%);
    opacity:.85;
  }
  .tier{
    position:absolute;
    border-radius:14px;
    background:linear-gradient(180deg,#f4d8bd 0%,#e2b79a 52%,#c78f78 100%);
    box-shadow:
      inset 0 6px 0 rgba(255,247,234,.62),
      inset 0 -10px 18px rgba(120,60,50,.2),
      0 14px 28px rgba(0,0,0,.32);
  }
  .tier::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    background-image:
      radial-gradient(circle at 18% 26%,rgba(255,255,255,.55) 0 1.4px,transparent 2px),
      radial-gradient(circle at 44% 72%,rgba(255,255,255,.4) 0 1.2px,transparent 2px),
      radial-gradient(circle at 72% 38%,rgba(255,255,255,.45) 0 1.4px,transparent 2px),
      radial-gradient(circle at 88% 80%,rgba(255,255,255,.35) 0 1.2px,transparent 2px);
  }
  .tier.top{
    left:55px;bottom:88px;
    width:150px;height:58px;
    border-radius:12px;
  }
  .tier.bottom{
    left:15px;bottom:20px;
    width:230px;height:70px;
  }

  .candles{position:absolute;inset:0;}
  .candle-stick{
    position:absolute;
    bottom:146px;
    width:6px;height:36px;
    border-radius:3px;
    background:repeating-linear-gradient(180deg,#fff8ee 0 5px,#e8b4a0 5px 10px);
    box-shadow:0 0 10px rgba(255,200,150,.25);
  }
  .candle-stick:nth-child(1){left:68px;}
  .candle-stick:nth-child(2){left:100px;}
  .candle-stick:nth-child(3){left:130px;}
  .candle-stick:nth-child(4){left:160px;}
  .candle-stick:nth-child(5){left:192px;}

  .flame{
    position:absolute;
    left:50%;top:-15px;
    width:11px;height:16px;
    margin-left:-5.5px;
    border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
    background:radial-gradient(circle at 50% 72%,#fff8d6 0%,#ffd47e 42%,#ff8c46 78%,rgba(255,120,60,.2) 100%);
    box-shadow:0 0 18px rgba(255,180,90,.85),0 0 40px rgba(255,150,70,.35);
    transform-origin:50% 100%;
    animation:flicker 1.7s ease-in-out infinite;
    transition:opacity .5s ease,transform .6s ease;
  }
  .candle-stick:nth-child(2) .flame{animation-delay:-.4s;}
  .candle-stick:nth-child(3) .flame{animation-delay:-.9s;}
  .candle-stick:nth-child(4) .flame{animation-delay:-1.3s;}
  .candle-stick:nth-child(5) .flame{animation-delay:-.7s;}

  .cake.blown .flame{
    opacity:0;
    transform:scale(.15) translateY(-8px);
    animation:none;
  }

  /* ---------- 终章卡片 ---------- */
  .final{
    position:fixed;
    inset:0;
    z-index:6;
    display:grid;
    place-items:center;
    padding:24px;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity 1.2s ease,visibility 0s linear 1.2s;
  }
  .final.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transition:opacity 1.2s ease,visibility 0s;
  }
  .final-inner{
    width:min(94vw,540px);
    padding:clamp(30px,5vw,46px) clamp(22px,4vw,36px);
    border-radius:22px;
    border:1px solid rgba(232,201,160,.26);
    background:linear-gradient(165deg,rgba(18,23,48,.82),rgba(9,12,28,.9));
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:0 40px 90px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);
    text-align:center;
    transform:translateY(22px) scale(.98);
    transition:transform 1.2s var(--ease);
  }
  .final.show .final-inner{transform:none;}

  .final-inner h2{
    margin:18px 0 0;
    font-size:clamp(24px,5.2vw,34px);
    font-weight:500;
    letter-spacing:.14em;
    text-indent:.14em;
    color:#fdf4e7;
    text-shadow:0 0 36px rgba(232,180,160,.4);
  }
  .final-msg{
    margin:20px 0 0;
    font-size:14px;
    line-height:2.1;
    letter-spacing:.1em;
    color:rgba(242,233,223,.72);
  }
  .final-date{
    margin:22px 0 0;
    font-size:11.5px;
    letter-spacing:.4em;
    text-indent:.4em;
    color:rgba(232,201,160,.6);
  }
  .final-sign{
    margin:10px 0 26px;
    font-family:var(--hand);
    font-size:15px;
    letter-spacing:.14em;
    color:rgba(232,180,160,.9);
  }

  /* ---------- 音乐按钮 ---------- */
  .music-btn{
    position:fixed;
    top:max(18px,env(safe-area-inset-top));
    right:max(18px,env(safe-area-inset-right));
    z-index:40;
    border:1px solid rgba(232,201,160,.24);
    background:rgba(10,14,32,.4);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    color:rgba(242,233,223,.66);
    font-size:11px;
    letter-spacing:.16em;
    padding:9px 15px;
    border-radius:999px;
    cursor:pointer;
    transition:color .4s ease,border-color .4s ease,box-shadow .4s ease;
  }
  .music-btn:hover{color:#f6e9d8;border-color:rgba(232,201,160,.55);}
  .music-btn.on{
    color:#ffe3bd;
    border-color:rgba(232,201,160,.6);
    box-shadow:0 0 22px rgba(232,180,160,.2);
  }

  /* ---------- 动画 ---------- */
  @keyframes drift{
    from{transform:translate3d(0,0,0) scale(1);}
    to{transform:translate3d(6%,4%,0) scale(1.12);}
  }
  @keyframes breathe{
    0%,100%{opacity:.55;transform:scale(.94);}
    50%{opacity:1;transform:scale(1.06);}
  }
  @keyframes floaty{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-9px);}
  }
  @keyframes hintPulse{
    0%,100%{opacity:.4;}
    50%{opacity:.85;}
  }
  @keyframes spin{

  }
  @keyframes ringPulse{

    50%{transform:scale(1.04);opacity:.35;}
  }
  @keyframes flicker{

    25%{transform:scale(1.06,.94) rotate(2deg);opacity:1;}
    50%{transform:scale(.94,1.08) rotate(-2deg);opacity:.9;}
    75%{transform:scale(1.03,.97) rotate(1deg);opacity:1;}

  /* ---------- 响应式 ---------- */
  @media (max-width:400px){

/* ========================= 基础工具 ========================= */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ========================= 画布基础 ========================= */
const starsCv = $('#stars');
const fxCv = $('#fx');
const sctx = starsCv.getContext('2d');
const fctx = fxCv.getContext('2d');

let W = window.innerWidth;
let H = window.innerHeight;
let DPR = 1;

function resizeCanvas() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, W < 640 ? 3 : 2);

  [starsCv, fxCv].forEach(cv => {
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
  });

  sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  makeStars();
}

/* ========================= 星空 ========================= */
let stars = [];
let shooting = null;
let nextShooting = 0;

function makeStars() {
  const count = prefersReduced ? 90 : Math.round(clamp((W * H) / 9000, 130, 260));
  stars = Array.from({ length: count }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: rand(0.4, 1.6),
    a: rand(0.18, 0.85),
    speed: rand(0.4, 1.5),
    phase: rand(0, Math.PI * 2),
    depth: rand(0.3, 1)
  }));
}

function drawStars(now) {
  sctx.clearRect(0, 0, W, H);

  const px = (pointer.x / W - 0.5) * 2;
  const py = (pointer.y / H - 0.5) * 2;

  for (const s of stars) {
    const twinkle = 0.6 + 0.4 * Math.sin(now * 0.0011 * s.speed + s.phase);
    const alpha = s.a * twinkle;
    const x = s.x + px * 10 * s.depth;
    const y = s.y + py * 10 * s.depth;

    sctx.beginPath();
    sctx.fillStyle = 'rgba(255,244,228,' + alpha + ')';
    sctx.arc(x, y, s.r, 0, Math.PI * 2);
    sctx.fill();

    if (s.r > 1.25) {
      sctx.beginPath();
      sctx.fillStyle = 'rgba(255,232,200,' + (alpha * 0.16) + ')';
      sctx.arc(x, y, s.r * 3.4, 0, Math.PI * 2);
      sctx.fill();
    }
  }

  if (!prefersReduced) {
    if (!shooting && now > nextShooting && Math.random() < 0.012) {
      shooting = {
        x: rand(W * 0.15, W * 0.85),
        y: rand(0, H * 0.4),
        len: rand(90, 180),
        life: 0,
        dur: rand(700, 1100)
      };
    }

    if (shooting) {
      shooting.life += 16;
      const p = shooting.life / shooting.dur;
      if (p >= 1) {
        shooting = null;
        nextShooting = now + rand(4000, 9000);
      } else {
        const x = shooting.x + p * 260;
        const y = shooting.y + p * 150;
        const g = sctx.createLinearGradient(x, y, x - shooting.len, y - shooting.len * 0.55);
        g.addColorStop(0, 'rgba(255,240,215,' + (0.75 * (1 - p)) + ')');
        g.addColorStop(1, 'rgba(255,240,215,0)');
        sctx.strokeStyle = g;
        sctx.lineWidth = 1.4;
        sctx.beginPath();
        sctx.moveTo(x, y);
        sctx.lineTo(x - shooting.len, y - shooting.len * 0.55);
        sctx.stroke();
      }
    }
  }
}

/* ========================= 名字粒子 ========================= */
let nameParticles = [];
let nameStart = 0;
let nameFadeAt = null;

function spawnName(text) {
  nameParticles = [];
  nameFadeAt = null;

  const off = document.createElement('canvas');
  off.width = W;
  off.height = H;
  const c = off.getContext('2d');

  let fontSize = Math.min(W * 0.26, H * 0.2, 190);
  const fontStack = '"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",serif';

  c.font = '600 ' + fontSize + 'px ' + fontStack;
  let textWidth = c.measureText(text).width;
  const maxWidth = W * 0.8;

  if (textWidth > maxWidth) {
    fontSize *= maxWidth / textWidth;
    c.font = '600 ' + fontSize + 'px ' + fontStack;
  }

  c.fillStyle = '#ffffff';
  c.strokeStyle = '#ffffff';
  c.lineWidth = Math.max(1, fontSize * 0.014);
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.strokeText(text, W / 2, H * 0.44);
  c.fillText(text, W / 2, H * 0.44);

  const data = c.getImageData(0, 0, off.width, off.height).data;
  const dense = W < 640;
  const step = dense ? 2 : 4;
  const targets = [];

  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      if (data[(y * W + x) * 4 + 3] > 110) targets.push([x, y]);
    }
  }

  for (let i = targets.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = targets[i];
    targets[i] = targets[j];
    targets[j] = tmp;
  }

  const max = prefersReduced ? 420 : (dense ? 2000 : 1000);
  const points = targets.slice(0, max);

  points.forEach(([tx, ty]) => {
    const angle = rand(0, Math.PI * 2);
    const radius = rand(Math.max(W, H) * 0.32, Math.max(W, H) * 0.72);
    nameParticles.push({
      sx: W / 2 + Math.cos(angle) * radius,
      sy: H * 0.44 + Math.sin(angle) * radius,
      tx,
      ty,
      delay: rand(0, 380),
      dur: rand(1000, 1800),
      size: dense ? rand(0.95, 2.0) : rand(0.7, 1.9),
      seed: rand(0, 1000)
    });
  });

  nameStart = performance.now();
}

function drawName(now) {
  if (!nameParticles.length) return;

  let fade = 1;
  if (nameFadeAt !== null) {
    fade = clamp(1 - (now - nameFadeAt) / 700, 0, 1);
    if (fade <= 0) {
      nameParticles = [];
      return;
    }
  }

  const halo = W >= 640;
  fctx.globalCompositeOperation = halo ? 'lighter' : 'source-over';

  const cores = new Map();
  const halos = new Map();

  for (const p of nameParticles) {
    const local = clamp((now - nameStart - p.delay) / p.dur, 0, 1);
    const e = easeOutCubic(local);

    let x = p.sx + (p.tx - p.sx) * e;
    let y = p.sy + (p.ty - p.sy) * e;

    if (local >= 1) {
      x = p.tx + Math.sin(now * 0.0012 + p.seed) * 1.5;
      y = p.ty + Math.cos(now * 0.0009 + p.seed) * 1.2;
    }

    const key = Math.round(fade * (0.25 + 0.75 * e) * 10);

    if (!cores.has(key)) cores.set(key, []);
    cores.get(key).push(x, y, p.size);

    if (halo) {
      if (!halos.has(key)) halos.set(key, []);
      halos.get(key).push(x, y, p.size * 3.2);
    }
  }

  if (halo) {
    fctx.fillStyle = '#ffd9a0';
    halos.forEach((arr, k) => {
      fctx.globalAlpha = (k / 10) * 0.16;
      fctx.beginPath();
      for (let i = 0; i < arr.length; i += 3) {
        fctx.moveTo(arr[i] + arr[i + 2], arr[i + 1]);
        fctx.arc(arr[i], arr[i + 1], arr[i + 2], 0, Math.PI * 2);
      }
      fctx.fill();
    });
  }

  fctx.fillStyle = '#ffeccd';
  cores.forEach((arr, k) => {
    fctx.globalAlpha = Math.min(1, k / 10);
    fctx.beginPath();
    for (let i = 0; i < arr.length; i += 3) {
      fctx.moveTo(arr[i] + arr[i + 2], arr[i + 1]);
      fctx.arc(arr[i], arr[i + 1], arr[i + 2], 0, Math.PI * 2);
    }
    fctx.fill();
  });

  fctx.globalAlpha = 1;
  fctx.globalCompositeOperation = 'source-over';
}

/* ========================= 花瓣 ========================= */
let petals = [];
let petalOn = false;
let lastPetalAt = 0;

function spawnPetal() {
  petals.push({
    x: rand(-40, W + 40),
    y: rand(-80, -10),
    vx: rand(-0.25, 0.45),
    vy: rand(0.55, 1.35),
    rot: rand(0, Math.PI * 2),
    spin: rand(-0.012, 0.012),
    sway: rand(0.004, 0.011),
    phase: rand(0, Math.PI * 2),
    size: rand(0.75, 1.5),
    alpha: rand(0.55, 0.95)
  });
}

function updatePetals(now) {
  if (petalOn && petals.length < (prefersReduced ? 16 : 42) && now - lastPetalAt > 160) {
    spawnPetal();
    lastPetalAt = now;
  }

  petals = petals.filter(p => p.y < H + 60);

  for (const p of petals) {
    p.x += p.vx + Math.sin(now * p.sway + p.phase) * 0.7;
    p.y += p.vy;
    p.rot += p.spin;

    fctx.save();
    fctx.translate(p.x, p.y);
    fctx.rotate(p.rot);
    fctx.scale(p.size, p.size);

    const g = fctx.createLinearGradient(0, -6, 0, 7);
    g.addColorStop(0, 'rgba(255,220,203,' + p.alpha + ')');
    g.addColorStop(0.6, 'rgba(232,180,160,' + (p.alpha * 0.92) + ')');
    g.addColorStop(1, 'rgba(196,116,118,' + (p.alpha * 0.75) + ')');

    fctx.beginPath();
    fctx.moveTo(0, -6);
    fctx.bezierCurveTo(5, -5, 6, 2, 0, 7);
    fctx.bezierCurveTo(-6, 2, -5, -5, 0, -6);
    fctx.fillStyle = g;
    fctx.fill();
    fctx.restore();
  }
}

/* ========================= 烟花与彩带 ========================= */
let fwParticles = [];
let fwUntil = 0;
let lastBurst = 0;
let confetti = [];

const FW_COLORS = ['#ffd9a0', '#ffb3a0', '#ffe9c8', '#ffc4d6', '#fff2dc'];
const CONF_COLORS = ['#e8c9a0', '#e8b4a0', '#ffe3bd', '#f6e7d4', '#d9a6a0'];

function burst(x, y) {
  const color = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
  const count = prefersReduced ? 34 : 64;

  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = rand(0.6, 4.2);
    fwParticles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: rand(0.008, 0.016),
      size: rand(1, 2.3),
      color
    });
  }
}

function startFireworks() {
  fwUntil = performance.now() + 7000;
  lastBurst = 0;
}

function spawnConfetti() {
  const count = prefersReduced ? 50 : 130;
  for (let i = 0; i < count; i++) {
    confetti.push({
      x: rand(0, W),
      y: rand(-H * 0.5, -10),
      vx: rand(-0.5, 0.5),
      vy: rand(0.7, 2),
      rot: rand(0, Math.PI * 2),
      spin: rand(-0.08, 0.08),
      w: rand(4, 8),
      h: rand(8, 15),
      color: CONF_COLORS[Math.floor(Math.random() * CONF_COLORS.length)],
      alpha: rand(0.65, 1)
    });
  }
}

function updateFireworks(now) {
  if (now < fwUntil && now - lastBurst > 480) {
    lastBurst = now;
    burst(rand(W * 0.15, W * 0.85), rand(H * 0.12, H * 0.52));
  }

  fctx.globalCompositeOperation = 'lighter';

  fwParticles = fwParticles.filter(p => p.life > 0);
  for (const p of fwParticles) {
    p.vx *= 0.985;
    p.vy = p.vy * 0.985 + 0.035;
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;

    fctx.beginPath();
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.color;
    fctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    fctx.fill();
  }
  fctx.globalAlpha = 1;
  fctx.globalCompositeOperation = 'source-over';
}

function updateConfetti() {
  confetti = confetti.filter(p => p.y < H + 40);

  for (const p of confetti) {
    p.x += p.vx + Math.sin(p.rot) * 0.8;
    p.y += p.vy;
    p.rot += p.spin;

    fctx.save();
    fctx.translate(p.x, p.y);
    fctx.rotate(p.rot);
    fctx.globalAlpha = p.alpha;
    fctx.fillStyle = p.color;
    fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    fctx.restore();
  }
  fctx.globalAlpha = 1;
}

/* ========================= 主循环 ========================= */
const pointer = { x: W / 2, y: H / 2 };
let lastFrame = performance.now();

function loop(now) {
  const dt = Math.min(60, now - lastFrame);
  lastFrame = now;

  drawStars(now);

  fctx.clearRect(0, 0, W, H);
  updateFireworks(now);
  drawName(now);
  updatePetals(now);
  updateConfetti();

  requestAnimationFrame(loop);
}

/* ========================= 场景切换 ========================= */
const scenes = [
  $('#scene-cover'),
  $('#scene-gallery'),
  $('#scene-bloom'),
  $('#scene-candle')
];
let currentScene = 0;

function goScene(index) {
  if (index < 0 || index >= scenes.length) return;
  currentScene = index;
  scenes.forEach((s, i) => s.classList.toggle('active', i === index));

  if (index === 1) {
    alignGallery();
    setTimeout(updateDots, 60);
  }

  if (index === 2) {
    petalOn = true;
    revealLines();
  } else if (index === 3) {
    petalOn = false;
  }
}

/* ========================= 照片长廊 ========================= */
const track = $('#track');
const dots = $('#dots');
let cards = [];
const GALLERY_START = 1; // 默认聚焦第 2 张照片
let galleryAligned = false;

function buildGallery() {
  CONTENT.gallery.photos.forEach((item, i) => {
    const card = document.createElement('article');
    card.className = 'card';

    const print = document.createElement('div');
    print.className = 'print';

    const photo = document.createElement('div');
    photo.className = 'photo';

    if (item.src) {
      const img = document.createElement('img');
      img.src = item.src;
      img.alt = item.caption || '照片';
      img.loading = 'lazy';
      img.addEventListener('error', () => {
        img.remove();
        photo.appendChild(makeFallback(i));
      });
      photo.appendChild(img);
    } else {
      photo.appendChild(makeFallback(i));
    }

    const caption = document.createElement('p');
    caption.className = 'caption';
    caption.textContent = item.caption || '';

    print.appendChild(photo);
    print.appendChild(caption);
    card.appendChild(print);
    track.appendChild(card);
    cards.push(card);
  });

  cards.forEach((card, i) => {
    const dot = document.createElement('button');
    dot.className = 'dot' + (i === GALLERY_START ? ' active' : '');
    dot.type = 'button';
    dot.setAttribute('aria-label', '第 ' + (i + 1) + ' 张照片');
    dot.addEventListener('click', () => {
      const left = card.offsetLeft - (track.clientWidth - card.offsetWidth) / 2;
      track.scrollTo({ left, behavior: 'smooth' });
    });
    dots.appendChild(dot);
  });

  track.addEventListener('scroll', () => {
    window.requestAnimationFrame(updateDots);
  }, { passive: true });
}

function alignGallery() {
  if (galleryAligned) return;
  const card = cards[GALLERY_START];
  if (!card) return;
  galleryAligned = true;
  track.scrollLeft = card.offsetLeft - (track.clientWidth - card.offsetWidth) / 2;
}

function makeFallback(index) {
  const box = document.createElement('div');
  box.className = 'ph-fallback';

  const title = document.createElement('span');
  title.textContent = CONTENT.gallery.fallbackTitle + ' ' + String(index + 1).padStart(2, '0');

  const tip = document.createElement('small');
  tip.textContent = CONTENT.gallery.fallbackTip;

  box.appendChild(title);
  box.appendChild(tip);
  return box;
}

function updateDots() {
  if (!cards.length) return;

  const center = track.scrollLeft + track.clientWidth / 2;
  let best = 0;
  let bestDist = Infinity;

  cards.forEach((card, i) => {
    const cardCenter = card.offsetLeft + card.offsetWidth / 2;
    const dist = Math.abs(cardCenter - center);
    if (dist < bestDist) {
      bestDist = dist;
      best = i;
    }
  });

  Array.from(dots.children).forEach((dot, i) => {
    dot.classList.toggle('active', i === best);
  });
}

/* ========================= 想对你说 ========================= */
let linesRevealed = false;

function buildLines() {
  const box = $('#lines');
  CONTENT.words.lines.forEach((text, i) => {
    const p = document.createElement('p');
    p.className = 'line';
    p.textContent = text;
    p.style.transitionDelay = (0.35 + i * 0.65) + 's';
    box.appendChild(p);
  });
}

function revealLines() {
  if (linesRevealed) return;
  linesRevealed = true;

  setTimeout(() => {
    $$('.line').forEach(p => p.classList.add('in'));
  }, 220);
}

function applyPortrait() {
  const box = $('#portrait');
  const fallback = $('#portraitFallback');

  if (CONTENT.words.portrait.src) {
    const img = document.createElement('img');
    img.src = CONTENT.words.portrait.src;
    img.alt = CONTENT.words.portrait.alt || '照片';
    img.addEventListener('load', () => { fallback.style.display = 'none'; });
    img.addEventListener('error', () => img.remove());
    box.insertBefore(img, fallback);
  }
}

/* ========================= 音频 ========================= */
let actx = null;
let master = null;
let musicOn = false;
let padStarted = false;

function ensureAudio() {
  if (actx) return actx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;

  actx = new AC();
  master = actx.createGain();
  master.gain.value = 0;
  master.connect(actx.destination);
  return actx;
}

function startPad() {
  if (!actx || padStarted) return;
  padStarted = true;

  const filter = actx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 880;
  filter.Q.value = 0.7;
  filter.connect(master);

  const notes = [130.81, 196.0, 261.63, 329.63];
  notes.forEach((freq, i) => {
    const osc = actx.createOscillator();
    osc.type = i === 0 ? 'sine' : 'triangle';
    osc.frequency.value = freq;
    osc.detune.value = i * 3;

    const gain = actx.createGain();
    gain.gain.value = 0.055 / (1 + i * 0.55);

    osc.connect(gain);
    gain.connect(filter);
    osc.start();
  });

  const lfo = actx.createOscillator();
  lfo.frequency.value = 0.07;
  const lfoGain = actx.createGain();
  lfoGain.gain.value = 420;
  lfo.connect(lfoGain);
  lfoGain.connect(filter.frequency);
  lfo.start();
}

function chime(big) {
  if (!actx) return;
  if (actx.state === 'suspended') actx.resume();

  const t = actx.currentTime;
  const notes = big ? [523.25, 659.25, 783.99, 1046.5] : [783.99, 1046.5, 1318.5];

  notes.forEach((freq, i) => {
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;

    const start = t + i * 0.11;
    const peak = big ? 0.09 : 0.055;

    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.linearRampToValueAtTime(peak / (i * 0.5 + 1), start + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + (big ? 2.4 : 1.6));

    osc.connect(gain);
    gain.connect(actx.destination);
    osc.start(start);
    osc.stop(start + 2.6);
  });
}

const musicBtn = $('#musicBtn');

async function toggleMusic() {
  ensureAudio();
  if (!actx) return;

  if (actx.state === 'suspended') await actx.resume();
  startPad();

  musicOn = !musicOn;
  const t = actx.currentTime;
  master.gain.cancelScheduledValues(t);
  master.gain.setValueAtTime(master.gain.value, t);
  master.gain.linearRampToValueAtTime(musicOn ? 0.16 : 0.0001, t + (musicOn ? 2.4 : 1.1));

  musicBtn.classList.toggle('on', musicOn);
  musicBtn.setAttribute('aria-pressed', String(musicOn));
  musicBtn.textContent = musicOn ? CONTENT.ui.musicOn : CONTENT.ui.musicOff;
}

musicBtn.addEventListener('click', toggleMusic);

  const glow = $('#cursorGlow');
  glow.style.transform = 'translate3d(' + e.clientX + 'px,' + e.clientY + 'px,0)';
  glow.style.opacity = '1';
});

window.addEventListener('pointerleave', () => {
  $('#cursorGlow').style.opacity = '0';
});

/* ========================= 初始化 ========================= */
function applyCopy() {
  $$('[data-copy]').forEach(el => {
    const path = el.dataset.copy.split('.');
    let value = CONTENT;
    for (const key of path) value = value && value[key];
    if (typeof value === 'string') el.textContent = value;
  });
}

function init() {
  applyCopy();
  document.title = CONTENT.ui.docTitle;

  resizeCanvas();
  buildGallery();
  buildLines();
  applyPortrait();

  if (window.matchMedia('(pointer: coarse)').matches) {
    $('#cursorGlow').style.display = 'none';
  }

  requestAnimationFrame(loop);
}

init();
